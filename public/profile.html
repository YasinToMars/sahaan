<!-- Owner: Yasin Shafiei. Requirement: FR1 (manage profile: edit name and email, change password, log out).
     What it does: two forms, "Your details" and "Change password", for any logged-in user. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your profile · Sahaan</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main id="main" class="container narrow">
    <section class="page-intro">
      <h1>Your profile</h1>
      <p id="profile-summary" class="muted"></p>
    </section>

    <section class="panel">
      <h2>Your details</h2>
      <div id="details-message" class="message"></div>
      <form id="details-form" class="form" novalidate>
        <div class="field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" maxlength="60" autocomplete="name" required>
          <p class="field-error" data-error-for="full_name"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" maxlength="120" autocomplete="email" required>
          <p class="field-error" data-error-for="email"></p>
        </div>
        <button type="submit" class="button">Save details</button>
      </form>
    </section>

    <section class="panel">
      <h2>Change password</h2>
      <div id="password-message" class="message"></div>
      <form id="password-form" class="form" novalidate>
        <div class="field">
          <label for="current_password">Current password</label>
          <input type="password" id="current_password" name="current_password" maxlength="64" autocomplete="current-password" required>
          <p class="field-error" data-error-for="current_password"></p>
        </div>
        <div class="field">
          <label for="new_password">New password</label>
          <input type="password" id="new_password" name="new_password" maxlength="64" autocomplete="new-password" aria-describedby="new-password-hint" required>
          <p id="new-password-hint" class="hint">8 to 64 characters, with at least one letter and one number.</p>
          <p class="field-error" data-error-for="new_password"></p>
        </div>
        <button type="submit" class="button">Change password</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">Sahaan · F28WP Group 15 · All restaurants and reviews are demo data</footer>

  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
