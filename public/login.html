<!-- Owner: Yasin Shafiei. Requirement: FR1 (log in).
     What it does: the login form. After logging in, the user goes back to the page they came from,
     or to the right home page for their role. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Sahaan</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main id="main" class="container narrow">
    <section class="panel">
      <h1>Log in</h1>
      <p class="muted">Welcome back. Log in to write reviews or manage your restaurants.</p>

      <div id="login-message" class="message"></div>

      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" maxlength="120" autocomplete="email" required>
          <p class="field-error" data-error-for="email"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" maxlength="64" autocomplete="current-password" required>
          <p class="field-error" data-error-for="password"></p>
        </div>

        <button type="submit" class="button button-wide">Log in</button>
      </form>

      <p class="form-footer">New to Sahaan? <a href="/register.html">Create an account</a></p>
    </section>
  </main>

  <footer class="site-footer">Sahaan · F28WP Group 15 · All restaurants and reviews are demo data</footer>

  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
