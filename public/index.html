<!-- Owner: Yasin Shafiei. Requirement: FR2 (search and filter) and FR3 (open a restaurant).
     What it does: the home page with the search box, the filters and the restaurant cards. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sahaan · Find restaurants in Dubai</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main id="main" class="container">
    <section class="page-intro">
      <h1>Find somewhere good to eat in Dubai</h1>
      <p class="muted">Search by restaurant, cuisine or dish, then narrow it down with the filters.</p>
    </section>

    <form id="search-form" class="search-panel" novalidate>
      <div class="field search-text">
        <label for="q">Search</label>
        <input type="search" id="q" name="q" maxlength="60" placeholder="e.g. shawarma, sushi or Cedar" autocomplete="off">
        <p class="field-error" data-error-for="q"></p>
      </div>

      <div class="field">
        <label for="cuisine">Cuisine</label>
        <select id="cuisine" name="cuisine">
          <option value="">All cuisines</option>
        </select>
      </div>

      <div class="field">
        <label for="location">Location</label>
        <select id="location" name="location">
          <option value="">All of Dubai</option>
        </select>
      </div>

      <div class="field">
        <label for="price">Price</label>
        <select id="price" name="price">
          <option value="">Any price</option>
        </select>
      </div>

      <div class="field">
        <label for="minRating">Minimum rating</label>
        <select id="minRating" name="minRating">
          <option value="">Any rating</option>
          <option value="4">★★★★ 4 and up</option>
          <option value="3">★★★ 3 and up</option>
          <option value="2">★★ 2 and up</option>
          <option value="1">★ 1 and up</option>
        </select>
      </div>

      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort" name="sort">
          <option value="rating">Top rated</option>
          <option value="name">Name (A to Z)</option>
          <option value="newest">Newest</option>
        </select>
      </div>

      <div class="search-actions">
        <button type="button" class="button button-secondary clear-filters">Clear filters</button>
      </div>
    </form>

    <div class="results-bar">
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <p id="restore-note" class="muted small"></p>
    </div>
    <div id="search-message" class="message"></div>
    <div id="results" class="card-grid"></div>
  </main>

  <footer class="site-footer">Sahaan · F28WP Group 15 · All restaurants and reviews are demo data</footer>

  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
